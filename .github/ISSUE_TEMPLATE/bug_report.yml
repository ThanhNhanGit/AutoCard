name: Bug report
description: Report a reproducible AutoCard failure
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please remove personal Anki content and copyrighted media from logs or attachments.
  - type: input
    id: version
    attributes:
      label: AutoCard version
      description: Commit SHA, release version, or approximate download date.
      placeholder: 9362aba or v1.0.0
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Subtitle loading or parsing
        - Known-word highlighting
        - N+1 detection or filtering
        - Frequency dictionary
        - Yomitan / AnkiConnect enrichment
        - Batch mining
        - Multi-line merge or media cropping
        - mpv integration
        - Installation or Git LFS
        - Other
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: Explain what failed and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. Click ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows, mpv, browser, Yomitan, Anki, AnkiConnect, subtitle source and format.
      placeholder: Windows 11; embedded ASS; Chrome; Yomitan ...; Anki ...
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste relevant server output and `/subtitle-debug` JSON. Remove private information first.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I fully restarted mpv and hard-refreshed the browser.
          required: true
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed personal and copyrighted content from this report.
          required: true
